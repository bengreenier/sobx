[package]
name = "sobx-ast-native"
version = "0.0.1-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxc_allocator = "=0.157.0"
oxc_ast = "=0.157.0"
oxc_parser = "=0.157.0"
oxc_semantic = "=0.157.0"
oxc_span = "=0.157.0"
oxc_syntax = "=0.157.0"
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
